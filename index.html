<!DOCTYPE html>
<html lang="en" data-lens="engineering">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olutola Owolabi — Systems &amp; Stories</title>
  <meta name="description" content="Olutola Owolabi — backend &amp; DevOps engineer, operations lead and writer. Engineering systems. Running operations. Writing it all down.">
  <meta name="author" content="Olutola Owolabi">
  <meta name="theme-color" content="#3A0E1E">

  <!-- Open Graph / social link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Olutola Owolabi — Systems &amp; Stories">
  <meta property="og:description" content="Backend &amp; DevOps engineer, operations lead and writer.">
  <meta property="og:image" content="assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Olutola Owolabi — Systems &amp; Stories">
  <meta name="twitter:description" content="Backend &amp; DevOps engineer, operations lead and writer.">
  <meta name="twitter:image" content="assets/og.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="preload" as="image" href="assets/img/portrait.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Sticky top bar: appears once the hero's switcher scrolls out of view -->
  <header class="topbar" id="topbar" aria-label="Site header">
    <a class="topbar__brand" href="#top" aria-label="Back to top">OO<span class="topbar__dot" aria-hidden="true"></span></a>
    <div class="lens-switcher lens-switcher--compact" data-switcher role="group" aria-label="Choose a lens"></div>
  </header>

  <!-- Shown only if the content files can't be loaded (e.g. page opened by double-clicking) -->
  <div class="load-warning" id="load-warning" role="alert" hidden>
    Couldn't load the content files. Open this site with VS Code's <strong>Live Server</strong> (right-click <code>index.html</code> → "Open with Live Server").
  </div>

  <main id="main">
    <!-- ============ 1. HERO ============ -->
    <section class="hero" id="top" aria-labelledby="hero-name">
      <div class="hero__inner">
        <!-- Left column (desktop): text, lens switcher, links, tools row -->
        <div class="hero__content">
          <h1 class="hero__name" id="hero-name">Olutola Owolabi</h1>

          <p class="hero__statement" id="hero-statement">
            <span class="hero__line"><span class="hero__line-inner"><em>Engineering</em> systems.</span></span>
            <span class="hero__line"><span class="hero__line-inner">Running <em>operations</em>.</span></span>
            <span class="hero__line"><span class="hero__line-inner"><em>Writing</em> it all down.</span></span>
          </p>
          <p class="hero__subtitle" id="hero-subtitle" aria-live="polite"></p>

          <div class="lens-switcher" data-switcher role="group" aria-label="Choose a lens" id="hero-switcher"></div>

          <nav class="hero__links" id="hero-links" aria-label="Profiles and contact"></nav>

          <div class="hero__tools" aria-label="Tools I work with">
            <p class="hero__tools-label" id="hero-tools-label">TOOLS I WORK WITH</p>
            <ul class="hero__tools-list" id="hero-tools-list"></ul>
          </div>
        </div>

        <!-- Right column (desktop): structured portrait with cut corner, hard offset block, viewfinder brackets & spec strip -->
        <div class="hero__visual">
          <figure class="hero__figure">
            <!-- Two horizontal blueprint dimension lines with tick marks near the photo -->
            <div class="hero__dim hero__dim--top" aria-hidden="true">
              <span class="hero__dim-label">W · 04</span>
            </div>
            <div class="hero__dim hero__dim--bottom" aria-hidden="true">
              <span class="hero__dim-label">4 : 5</span>
            </div>

            <div class="hero__frame-wrap">
              <!-- Four L-shaped viewfinder corner brackets outside the photo -->
              <span class="hero__corner hero__corner--tl" aria-hidden="true"></span>
              <span class="hero__corner hero__corner--tr" aria-hidden="true"></span>
              <span class="hero__corner hero__corner--bl" aria-hidden="true"></span>
              <span class="hero__corner hero__corner--br" aria-hidden="true"></span>

              <!-- Solid offset block in current lens accent colour (16px right, 16px down) -->
              <div class="hero__offset-block" aria-hidden="true"></div>

              <!-- Plain 4:5 rectangle with 48px diagonal top-right cut -->
              <div class="hero__photo-box">
                <img class="hero__img" id="hero-img" src="assets/img/portrait.jpg" alt="Portrait of Olutola Owolabi"
                     width="732" height="1024" fetchpriority="high">
              </div>
            </div>

            <figcaption class="hero__spec" id="hero-spec">
              OLUTOLA OWOLABI · BACKEND / DEVOPS · LAGOS, NG
            </figcaption>
          </figure>
        </div>
      </div>

      <!-- Full-width scrolling band at the bottom of the hero -->
      <div class="hero__band" aria-label="Core areas">
        <div class="hero__band-track" id="hero-band-track"></div>
      </div>
    </section>

    <!-- Sections 2–9 will be added here, one at a time -->
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
